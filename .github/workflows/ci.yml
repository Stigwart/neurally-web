name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Type check (astro check)
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build

      - name: Internal link check
        run: npm run check:links
      - name: HTML validation
        run: npm run check:html
      - name: JavaScript budget
        run: node scripts/check-js-budget.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke and accessibility tests
        run: npm test

      - name: Lighthouse CI
        run: npm run lhci

      - name: Upload built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report
            .lighthouseci
          retention-days: 14
          if-no-files-found: ignore
