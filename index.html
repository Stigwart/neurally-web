<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neurally — Coming soon</title>
  <meta name="description" content="Helping leaders decide how AI should change the business — and making that change happen." />
  <style>
    :root {
      --ink: #0b1b34;
      --chartreuse: #b8df00;
      --ivory: #f7f4ed;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--ink);
      color: var(--ivory);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.55;
    }

    .wrap {
      max-width: 560px;
      padding: 32px;
      text-align: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .logo .bridge {
      color: var(--chartreuse);
    }

    .eyebrow {
      margin: 24px 0 8px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--chartreuse);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin: 0 0 16px;
    }

    p.lede {
      color: rgba(247, 244, 237, 0.75);
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="logo">Ne<span class="bridge">u</span>rally</p>
    <p class="eyebrow">Coming soon</p>
    <h1>Helping leaders decide how AI should change the business — and making that change happen.</h1>
    <p class="lede">The site is on its way.</p>
  </div>
</body>
</html>
